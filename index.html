<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #fff0f5; overflow: hidden; }
        
        /* Sidebar tự động / có thể thu gọn */
        .sidebar {
            width: 280px;
            background: #ff477e;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 20px; }
        .menu-list { list-style: none; }
        .menu-list li {
            padding: 12px 15px;
            margin: 8px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-list li:hover { background: rgba(255,255,255,0.4); }

        /* Nội dung chính */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        h1 { color: #d90429; font-size: 3rem; margin-bottom: 20px; }
        p { color: #555; font-size: 1.2rem; max-width: 600px; line-height: 1.6; }
        
        /* Nút tự động kích hoạt hiệu ứng */
        .btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: #ff477e;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 126, 0.4);
        }
        .btn:hover { background: #d90429; }
    </style>
</head>
<body>

    <!-- Sidebar tự động hiển thị các mục lời chúc -->
    <div class="sidebar" id="sidebar">
        <div>
            <h2>🎉 Menu Sinh Nhật</h2>
            <ul class="menu-list">
                <li onclick="changeMessage(1)">Lời chúc từ Trái Tim 💖</li>
                <li onclick="changeMessage(2)">Kỷ niệm đáng nhớ 📸</li>
                <li onclick="changeMessage(3)">Điều ước tuổi mới 🌟</li>
            </ul>
        </div>
        <div style="font-size: 0.9rem; opacity: 0.8;">Made with love ❤️</div>
    </div>

    <!-- Phần hiển thị chính -->
    <div class="main-content">
        <h1 id="title-text">Chúc Mừng Sinh Nhật Bạn Nhé!</h1>
        <p id="desc-text">Chúc bạn có một ngày sinh nhật ngập tràn niềm vui, hạnh phúc bên gia đình và đạt được mọi dự định trong tuổi mới!</p>
        <button class="btn" onclick="autoAnimate()">Bất ngờ chưa? 🎁</button>
    </div>

    <script>
        // Mảng chứa các nội dung thay đổi tự động khi bấm vào sidebar
        const contentData = {
            1: { title: "Tuổi mới rực rỡ!", desc: "Chúc mọi điều may mắn, nụ cười luôn nở trên môi và luôn kiên định với con đường mình đã chọn." },
            2: { title: "Những kỷ niệm đẹp", desc: "Cảm ơn vì đã đồng hành qua nhiều khoảnh khắc tuyệt vời. Chúc tình bạn/tình yêu của chúng ta mãi bền chặt." },
            3: { title: "Ngôi sao hy vọng", desc: "Hãy thổi nến và ước những điều tốt đẹp nhất nhé, mọi ước mơ ở tuổi mới sẽ thành hiện thực!" }
        };

        function changeMessage(id) {
            document.getElementById("title-text").innerText = contentData[id].title;
            document.getElementById("desc-text").innerText = contentData[id].desc;
        }

        // Tự động chuyển đổi lời chúc sau mỗi 5 giây như một dạng slide tự động
        let currentIdx = 1;
        function autoAnimate() {
            currentIdx = currentIdx > 3 ? 1 : currentIdx;
            changeMessage(currentIdx);
            currentIdx++;
        }
        
        // Tự động chạy đổi lời chúc khi vừa mở trang sau 4 giây
        setInterval(() => {
            autoAnimate();
        }, 5000);
    </script>
</body>
</html>
